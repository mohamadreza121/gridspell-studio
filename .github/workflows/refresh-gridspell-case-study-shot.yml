name: Refresh GridSpell case-study screenshot

on:
  push:
    branches:
      - refresh/gridspell-case-study-screenshot
    paths:
      - .github/workflows/refresh-gridspell-case-study-shot.yml

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, '[skip screenshot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refresh/gridspell-case-study-screenshot
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture current homepage hero
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1920, height: 1080 },
              deviceScaleFactor: 1
            });

            await page.emulateMedia({ reducedMotion: 'reduce' });
            await page.goto('https://gridspellstudio.com/?case-study-shot=v4', {
              waitUntil: 'networkidle',
              timeout: 120000
            });

            await page.waitForSelector('.home-hero-mode-tabs', { state: 'visible' });
            await page.waitForFunction(() =>
              document.querySelectorAll('.home-hero-mode-tabs button').length === 4
            );

            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(2500);

            const labels = await page
              .locator('.home-hero-mode-tabs button')
              .allTextContents();

            if (labels.length !== 4) {
              throw new Error(`Expected four hero tabs, received ${labels.length}`);
            }

            await page.screenshot({
              path: 'public/images/work/selected-work/gridspell-studio-v4.jpg',
              type: 'jpeg',
              quality: 90,
              fullPage: false
            });

            console.log(`Captured hero tabs: ${labels.join(', ')}`);
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit screenshot and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/work/selected-work/gridspell-studio-v4.jpg
          git rm .github/workflows/refresh-gridspell-case-study-shot.yml
          git commit -m "Refresh GridSpell case-study screenshot [skip screenshot]"
          git push origin HEAD:refresh/gridspell-case-study-screenshot
