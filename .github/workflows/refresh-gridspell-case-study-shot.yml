name: Refresh GridSpell case-study screenshot

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.pull_request.head.sha, '[skip screenshot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refresh/gridspell-case-study-screenshot
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture current homepage hero
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1920, height: 1080 },
              deviceScaleFactor: 1
            });

            await page.goto('https://gridspellstudio.com/?case-study-shot=v4', {
              waitUntil: 'domcontentloaded',
              timeout: 120000
            });

            const tabs = page.locator(
              '.home-presentation-only .home-hero-mode-tabs button'
            );

            await tabs.first().waitFor({ state: 'visible', timeout: 60000 });
            await page.waitForFunction(() =>
              document.querySelectorAll(
                '.home-presentation-only .home-hero-mode-tabs button'
              ).length === 4
            );
            await page.evaluate(async () => {
              window.scrollTo(0, 0);
              await document.fonts.ready;
            });
            await page.addStyleTag({
              content: 'html::-webkit-scrollbar, body::-webkit-scrollbar { display: none !important; } html, body { scrollbar-width: none !important; }'
            });
            await page.waitForTimeout(3500);

            const labels = (await tabs.allTextContents()).map((label) => label.trim());
            const tabsBox = await page
              .locator('.home-presentation-only .home-hero-mode-tabs')
              .boundingBox();

            if (labels.length !== 4) {
              throw new Error(`Expected four hero tabs, received ${labels.length}`);
            }

            if (!tabsBox || tabsBox.y + tabsBox.height > 1075) {
              throw new Error(`Hero tabs are outside the screenshot viewport: ${JSON.stringify(tabsBox)}`);
            }

            await page.screenshot({
              path: 'public/images/work/selected-work/gridspell-studio-v4.jpg',
              type: 'jpeg',
              quality: 90,
              fullPage: false
            });

            console.log(`Captured hero tabs: ${labels.join(', ')}`);
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit screenshot and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/work/selected-work/gridspell-studio-v4.jpg
          git rm .github/workflows/refresh-gridspell-case-study-shot.yml
          git commit -m "Refresh GridSpell case-study screenshot [skip screenshot]"
          git push origin HEAD:refresh/gridspell-case-study-screenshot
