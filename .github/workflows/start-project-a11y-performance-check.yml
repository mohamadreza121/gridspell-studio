name: Start project accessibility and performance check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-start-project:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-test-publishable-key
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Type-check, lint, and build
        run: npm run check

      - name: Start production application
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/gridspell-start-project.log 2>&1 &
          echo $! > /tmp/gridspell-start-project.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/start-project > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/gridspell-start-project.log
          exit 1

      - name: Test accessibility tree and form errors
        run: npx playwright test tests/e2e/accessibility.spec.ts --grep "project" --project=desktop-chromium

      - name: Test preserved form context and submission
        run: npx playwright test tests/e2e/start-project.spec.ts --project=desktop-chromium

      - name: Test mobile and desktop performance budgets
        run: npx playwright test tests/e2e/start-project-performance.spec.ts --project=desktop-chromium

      - name: Test responsive layouts
        run: npx playwright test tests/e2e/responsive.spec.ts --grep "/start-project fits" --project=desktop-chromium --project=tablet-chromium --project=mobile-chromium --project=small-phone-chromium

      - name: Test reduced motion
        run: npx playwright test tests/e2e/reduced-motion.spec.ts --grep "/start-project remains" --project=desktop-chromium

      - name: Capture final desktop and mobile layouts
        run: |
          mkdir -p /tmp/start-project-previews
          node <<'NODE'
          const { chromium } = require('@playwright/test');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const [name, width, height] of [
              ['desktop', 1440, 900],
              ['mobile', 390, 844]
            ]) {
              const page = await browser.newPage({ viewport: { width, height } });
              await page.goto('http://127.0.0.1:3000/start-project', {
                waitUntil: 'networkidle'
              });
              await page.screenshot({
                path: `/tmp/start-project-previews/${name}.png`,
                fullPage: true
              });
              await page.close();
            }
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: start-project-a11y-performance-diagnostics
          path: |
            /tmp/start-project-previews
            /tmp/gridspell-start-project.log
            playwright-report
            test-results
          retention-days: 1

      - name: Stop production application
        if: always()
        run: |
          if [ -f /tmp/gridspell-start-project.pid ]; then
            kill "$(cat /tmp/gridspell-start-project.pid)" || true
          fi
