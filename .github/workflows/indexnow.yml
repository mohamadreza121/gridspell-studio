name: Submit production URLs to IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gridspell-indexnow-production
  cancel-in-progress: true

jobs:
  submit-indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out production source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for the production deployment and submit its sitemap
        run: node scripts/submit-indexnow.mjs
