name: Production start-project desktop audit

on:
  push:
    branches:
      - audit/start-project-desktop-post-nav
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Confirm production route
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://gridspellstudio.com/start-project)"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Production route did not become ready in time."
          exit 1

      - name: Run Lighthouse desktop audit
        run: |
          set -euo pipefail
          npx --yes lighthouse@12.8.2 https://gridspellstudio.com/start-project \
            --preset=desktop \
            --only-categories=performance \
            --output=json \
            --output-path=/tmp/start-project-desktop-lighthouse.json \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"

      - name: Print performance result
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lighthouse = JSON.parse(fs.readFileSync('/tmp/start-project-desktop-lighthouse.json', 'utf8'));
          const audits = lighthouse.audits;
          const score = Math.round((lighthouse.categories.performance.score ?? 0) * 100);
          const tbt = Math.round(audits['total-blocking-time']?.numericValue ?? 0);
          const lcp = Math.round(audits['largest-contentful-paint']?.numericValue ?? 0);
          const fcp = Math.round(audits['first-contentful-paint']?.numericValue ?? 0);
          const unused = Math.round((audits['unused-javascript']?.details?.overallSavingsBytes ?? 0) / 1024);
          const blocking = Math.round((audits['render-blocking-resources']?.details?.overallSavingsMs ?? 0));

          console.log(`Performance score: ${score}`);
          console.log(`Total Blocking Time: ${tbt} ms`);
          console.log(`Largest Contentful Paint: ${lcp} ms`);
          console.log(`First Contentful Paint: ${fcp} ms`);
          console.log(`Unused JavaScript savings: ${unused} KiB`);
          console.log(`Render-blocking savings: ${blocking} ms`);
          NODE

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: start-project-desktop-lighthouse
          path: /tmp/start-project-desktop-lighthouse.json
          if-no-files-found: ignore
          retention-days: 1
