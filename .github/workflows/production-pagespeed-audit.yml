name: Production PageSpeed audit

on:
  push:
    branches:
      - perf/start-project-lean-initial-load

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Query PageSpeed Insights API
        shell: bash
        run: |
          set -euo pipefail
          target='https://gridspellstudio.com/start-project'
          encoded=$(python -c 'import urllib.parse; print(urllib.parse.quote("https://gridspellstudio.com/start-project", safe=""))')
          curl --fail --retry 3 --retry-delay 10 --max-time 300 \
            "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=${encoded}&strategy=mobile&category=performance" \
            -o mobile.json
          curl --fail --retry 3 --retry-delay 10 --max-time 300 \
            "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=${encoded}&strategy=desktop&category=performance" \
            -o desktop.json

      - name: Summarize scores and diagnostics
        shell: bash
        run: |
          node <<'NODE' | tee pagespeed-summary.txt
          const fs = require('fs');
          for (const strategy of ['mobile', 'desktop']) {
            const report = JSON.parse(fs.readFileSync(`${strategy}.json`, 'utf8'));
            const result = report.lighthouseResult;
            const audits = result.audits;
            const score = Math.round(result.categories.performance.score * 100);
            const value = (id) => audits[id]?.displayValue ?? 'n/a';
            const bytes = (id) => audits[id]?.details?.overallSavingsBytes ?? 0;
            const ms = (id) => audits[id]?.details?.overallSavingsMs ?? 0;
            console.log(`${strategy.toUpperCase()} score: ${score}`);
            console.log(`FCP: ${value('first-contentful-paint')}`);
            console.log(`LCP: ${value('largest-contentful-paint')}`);
            console.log(`TBT: ${value('total-blocking-time')}`);
            console.log(`CLS: ${value('cumulative-layout-shift')}`);
            console.log(`Speed Index: ${value('speed-index')}`);
            console.log(`Render-blocking savings: ${Math.round(ms('render-blocking-insight'))} ms`);
            console.log(`Unused JS savings: ${Math.round(bytes('unused-javascript') / 1024)} KiB`);
            console.log(`Legacy JS savings: ${Math.round(bytes('legacy-javascript') / 1024)} KiB`);
            console.log('');
          }
          NODE

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: production-pagespeed-reports
          path: |
            mobile.json
            desktop.json
            pagespeed-summary.txt
          retention-days: 1
