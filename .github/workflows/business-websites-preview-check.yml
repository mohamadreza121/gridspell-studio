name: Business websites responsive preview check

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
  push:
    branches:
      - agent/business-websites-modern-redesign
    paths:
      - .github/workflows/business-websites-preview-check.yml

permissions:
  contents: write

jobs:
  responsive-preview:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip service preview]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/business-websites-modern-redesign
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Next server
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/gridspell-next.log 2>&1 &
          echo $! > /tmp/gridspell-next.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/services/business-websites > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/gridspell-next.log
          exit 1

      - name: Check desktop, tablet, and phone layouts
        run: |
          set -o pipefail
          node <<'NODE' 2>&1 | tee /tmp/business-websites-check.log
          const { chromium } = require('@playwright/test');

          const baseUrl = 'http://127.0.0.1:3000';
          const route = '/services/business-websites';
          const expectedHeading = 'A website that makes the business feel established.';
          const viewports = [
            { name: 'desktop', width: 1440, height: 1000 },
            { name: 'laptop', width: 1180, height: 820 },
            { name: 'tablet', width: 768, height: 1024 },
            { name: 'phone', width: 390, height: 844 },
            { name: 'small-phone', width: 320, height: 720 }
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });

            for (const viewport of viewports) {
              console.log(`checking ${viewport.name} at ${viewport.width}x${viewport.height}`);
              const page = await browser.newPage({ viewport });
              const runtimeErrors = [];

              page.on('pageerror', (error) => runtimeErrors.push(error.message));
              page.on('console', (message) => {
                if (message.type() === 'error') runtimeErrors.push(message.text());
              });

              await page.goto(`${baseUrl}${route}`, {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              });
              await page.getByRole('heading', {
                level: 1,
                name: expectedHeading
              }).waitFor({ state: 'visible', timeout: 20000 });
              await page.waitForTimeout(700);

              const layout = await page.evaluate(() => ({
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
                bodyWidth: document.body.getBoundingClientRect().width
              }));
              console.log(`${viewport.name} layout ${JSON.stringify(layout)}`);

              if (layout.scrollWidth > layout.clientWidth + 2) {
                throw new Error(`${viewport.name}: horizontal overflow ${JSON.stringify(layout)}`);
              }

              const hero = page.getByRole('heading', {
                level: 1,
                name: expectedHeading
              });
              const heroBox = await hero.boundingBox();
              console.log(`${viewport.name} hero ${JSON.stringify(heroBox)}`);

              if (!heroBox || heroBox.x < -1 || heroBox.x + heroBox.width > viewport.width + 1) {
                throw new Error(`${viewport.name}: hero heading is clipped ${JSON.stringify(heroBox)}`);
              }

              await page.getByText('The decision system', { exact: true }).waitFor({ state: 'visible' });
              await page.getByText('What ships', { exact: true }).waitFor({ state: 'visible' });
              await page.locator('#scope').waitFor({ state: 'attached' });

              const primaryCta = page.getByRole('link', {
                name: /Start a business website/i
              });
              const ctaBox = await primaryCta.boundingBox();
              console.log(`${viewport.name} CTA ${JSON.stringify(ctaBox)}`);

              if (!ctaBox || ctaBox.height < 44) {
                throw new Error(`${viewport.name}: primary CTA is smaller than 44px ${JSON.stringify(ctaBox)}`);
              }

              if (runtimeErrors.some((message) => /hydration|server rendered|not an animatable value/i.test(message))) {
                throw new Error(`${viewport.name}: runtime rendering errors ${runtimeErrors.join('\n')}`);
              }

              console.log(`${viewport.name}: passed`);
              await page.close();
            }

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: business-websites-responsive-log
          path: |
            /tmp/business-websites-check.log
            /tmp/gridspell-next.log
          retention-days: 1

      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/gridspell-next.pid ]; then
            kill "$(cat /tmp/gridspell-next.pid)" || true
          fi
          tail -n 120 /tmp/gridspell-next.log || true

      - name: Remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/business-websites-preview-check.yml
          git commit -m "Remove one-time service preview check [skip service preview]"
          git push origin HEAD:agent/business-websites-modern-redesign
