name: Apply homepage accessibility fix

on:
  push:
    branches:
      - main
    paths:
      - "scripts/fix-home-accessibility.mjs"
      - ".github/workflows/apply-home-accessibility-fix.yml"

permissions:
  contents: write

concurrency:
  group: homepage-accessibility-fix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply accessibility fixes
        run: node scripts/fix-home-accessibility.mjs

      - name: Verify lint
        run: npm run lint

      - name: Verify types
        run: npm run type-check

      - name: Commit verified fixes
        run: |
          git config user.name "gridspell-accessibility-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git rm scripts/fix-home-accessibility.mjs .github/workflows/apply-home-accessibility-fix.yml
          git commit -m "Fix homepage accessibility findings"
          git push origin main
