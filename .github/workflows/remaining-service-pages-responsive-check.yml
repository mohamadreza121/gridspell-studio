name: Remaining service pages responsive check

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

jobs:
  responsive-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Next server
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/gridspell-next.log 2>&1 &
          echo $! > /tmp/gridspell-next.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/services/website-redesign > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/gridspell-next.log
          exit 1

      - name: Check all redesigned service pages
        shell: bash
        run: |
          set -o pipefail
          node 2>&1 <<'NODE' | tee /tmp/service-sweep.log
          const { chromium } = require('@playwright/test');

          const baseUrl = 'http://127.0.0.1:3000';
          const routes = [
            ['/services/website-redesign', 'Turn the current website into the version the business has grown into.'],
            ['/services/landing-pages', 'A focused page that turns campaign attention into one measurable action.'],
            ['/services/client-portals', 'Give clients one secure place to see progress and move work forward.'],
            ['/services/full-stack-apps', 'Build the workflow your business needs—not another tool it has to work around.'],
            ['/services/care-plans', 'Keep the website healthy, current, and ready for the next change.']
          ];
          const viewports = [
            ['desktop', 1440, 960],
            ['laptop', 1180, 820],
            ['tablet', 768, 1024],
            ['phone', 390, 844],
            ['small-phone', 320, 720]
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });

            for (const [viewportName, width, height] of viewports) {
              for (const [path, heading] of routes) {
                console.log(`Checking ${viewportName} ${path}`);
                const page = await browser.newPage({ viewport: { width, height } });
                const runtimeProblems = [];

                page.on('pageerror', (error) => runtimeProblems.push(error.message));
                page.on('console', (message) => {
                  if (/hydration failed|server rendered html didn't match|not an animatable value/i.test(message.text())) {
                    runtimeProblems.push(message.text());
                  }
                });

                await page.goto(`${baseUrl}${path}`, {
                  waitUntil: 'domcontentloaded',
                  timeout: 60000
                });
                await page.getByRole('heading', { level: 1, name: heading })
                  .waitFor({ state: 'visible', timeout: 20000 });
                await page.waitForTimeout(350);

                const layout = await page.evaluate(() => ({
                  scrollWidth: document.documentElement.scrollWidth,
                  clientWidth: document.documentElement.clientWidth
                }));
                if (layout.scrollWidth > layout.clientWidth + 2) {
                  throw new Error(`${viewportName} ${path}: horizontal overflow ${JSON.stringify(layout)}`);
                }

                const heroBox = await page.getByRole('heading', { level: 1, name: heading }).boundingBox();
                if (!heroBox || heroBox.x < -1 || heroBox.x + heroBox.width > width + 1) {
                  throw new Error(`${viewportName} ${path}: clipped hero ${JSON.stringify(heroBox)}`);
                }

                await page.getByText('Why it matters', { exact: true }).waitFor({ state: 'visible' });
                await page.getByText('Outcomes', { exact: true }).waitFor({ state: 'visible' });
                await page.getByText('Core deliverables', { exact: true }).waitFor({ state: 'visible' });
                await page.locator('#scope').waitFor({ state: 'attached' });

                const ctaBox = await page.locator('a[href^="/start-project?service="]').first().boundingBox();
                if (!ctaBox || ctaBox.height < 44) {
                  throw new Error(`${viewportName} ${path}: primary CTA below 44px ${JSON.stringify(ctaBox)}`);
                }

                if (runtimeProblems.length > 0) {
                  throw new Error(`${viewportName} ${path}: runtime issues ${runtimeProblems.join('\n')}`);
                }

                console.log(`${viewportName} ${path}: passed`);
                await page.close();
              }
            }

            const reducedPage = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await reducedPage.emulateMedia({ reducedMotion: 'reduce' });
            await reducedPage.goto(`${baseUrl}${routes[0][0]}`, { waitUntil: 'domcontentloaded' });
            await reducedPage.getByRole('heading', { level: 1, name: routes[0][1] }).waitFor({ state: 'visible' });
            await reducedPage.getByText('Why it matters', { exact: true }).waitFor({ state: 'visible' });
            await reducedPage.close();

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-service-pages-responsive-log
          path: |
            /tmp/service-sweep.log
            /tmp/gridspell-next.log
          retention-days: 1

      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/gridspell-next.pid ]; then
            kill "$(cat /tmp/gridspell-next.pid)" || true
          fi
