name: Remaining service pages responsive check

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

jobs:
  responsive-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Inspect preview routes
        shell: bash
        run: |
          set -o pipefail
          node 2>&1 <<'NODE' | tee /tmp/service-sweep.log
          const { chromium } = require('@playwright/test');

          const baseUrl = 'https://gridspell-studio-git-age-4595e1-mohammadrezas-projects-f5433da6.vercel.app';
          const routes = [
            '/services/website-redesign',
            '/services/landing-pages',
            '/services/client-portals',
            '/services/full-stack-apps',
            '/services/care-plans'
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });

            for (const path of routes) {
              const page = await browser.newPage({ viewport: { width: 1440, height: 960 } });
              const response = await page.goto(`${baseUrl}${path}?inspect=${Date.now()}`, {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              });
              await page.waitForTimeout(1000);

              const snapshot = await page.evaluate(() => ({
                title: document.title,
                h1: Array.from(document.querySelectorAll('h1')).map((node) => node.textContent?.replace(/\s+/g, ' ').trim()),
                body: document.body.innerText.replace(/\s+/g, ' ').slice(0, 500),
                width: {
                  scroll: document.documentElement.scrollWidth,
                  client: document.documentElement.clientWidth
                }
              }));

              console.log(JSON.stringify({
                path,
                status: response?.status(),
                finalUrl: page.url(),
                ...snapshot
              }, null, 2));

              await page.close();
            }

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload preview diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-service-pages-responsive-log
          path: /tmp/service-sweep.log
          retention-days: 1
