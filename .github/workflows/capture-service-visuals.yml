name: Capture service visual renders

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/capture-service-visuals.mjs"
      - ".github/workflows/capture-service-visuals.yml"
      - "src/config/services.ts"
      - "src/app/services-scene-fixes.css"
      - "src/components/services/**"

permissions:
  contents: write

concurrency:
  group: service-visual-renders
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture desktop service objects
        env:
          SERVICE_CAPTURE_BASE_URL: https://gridspellstudio.com
        run: |
          sleep 45
          node scripts/capture-service-visuals.mjs

      - name: Commit refreshed renders
        run: |
          git config user.name "gridspell-services-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/images/services/mobile

          if git diff --cached --quiet; then
            echo "No service visual changes to commit."
            exit 0
          fi

          git commit -m "Add mobile service visual renders"
          git push origin main
